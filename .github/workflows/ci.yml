name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: API tests (virtualized, offline)
        run: dotnet test tests/ApiTests/ApiTests.csproj --filter "Category=virtual" --logger "trx"

      - name: BDD tests (virtualized, offline)
        run: dotnet test tests/BddTests/BddTests.csproj --filter "Category=virtual" --logger "trx"

      - name: Live API tests
        run: dotnet test tests/ApiTests/ApiTests.csproj --filter "Category=live" --logger "trx"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 14
